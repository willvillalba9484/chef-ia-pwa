<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chef IA</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<meta name="theme-color" content="#e67e22">
<link rel="icon" href="images/icon-192.png">

</head>

<body>
<div id="pantallaCarga">
  <div class="cargando">
    <img src="img/logo.png" alt="Chef IA" class="logoCarga">
    <h2>👨‍🍳 Chef IA</h2>
    <p>Preparando tu cocina...</p>
    <div class="spinner"></div>
    <small>Esto puede tardar unos segundos la primera vez.</small>
  </div>
</div>
<div class="container">

<div class="logo-centro" style="margin-bottom:20px;">
<img
src="img/logo.png"
alt="Chef IA"
style="width:180px; max-width:80%; border-radius:20px;">
</div>

<div class="encabezado-centro"><h1>Chef IA</h1>

<p>Convierte tus ingredientes en recetas increíbles</p></div>

<div class="card">

<h3>📷 Escanear ingredientes</h3>

<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start;">

<label class="botonArchivo">
📷 Cámara
<input
type="file"
id="camara"
accept="image/*"
capture="environment"
style="display:none;">
</label>

<label class="botonArchivo">
🖼️ Galería
<input
type="file"
id="galeria"
accept="image/*"
style="display:none;">
</label>

</div>

<img id="vistaImagen">

<div id="analisisImagen"></div>

</div>

<div class="card">

<h3>🥗 Tus ingredientes</h3>

<textarea
id="ingredientes"
placeholder="Ejemplo: huevos, tomate, arroz"></textarea>

<select id="tipo">
<option value="rápida">⚡ Rápida</option>
<option value="saludable">🥗 Saludable</option>
<option value="económica">💰 Económica</option>
<option value="gourmet">👨‍🍳 Gourmet</option>
</select>

<button id="generar">🍳 Generar receta</button>

</div>

<div class="card">

<h2>👤 Mi perfil</h2>

<select id="objetivo">
<option value="saludable">🥗 Comer saludable</option>
<option value="musculo">💪 Ganar músculo</option>
<option value="economico">💰 Ahorrar dinero</option>
<option value="rapido">⚡ Cocinar rápido</option>
</select>

<select id="alimentacion">
<option value="normal">🍽️ Normal</option>
<option value="vegetariana">🥦 Vegetariana</option>
<option value="proteica">💪 Alta en proteína</option>
<option value="baja_carbohidratos">🥑 Baja en carbohidratos</option>
</select>

<select id="tiempo">
<option value="15 minutos">⏱️ 15 minutos</option>
<option value="30 minutos">⏱️ 30 minutos</option>
<option value="1 hora">⏱️ 1 hora</option>
</select>

<button id="guardarPerfil">💾 Guardar perfil</button>

</div>

<div id="resultado"></div>

<div class="card">
<h2>❤️ Favoritas</h2>
<div id="listaFavoritos"></div>
</div>

<div class="card">
<h2>📜 Historial</h2>
<div id="listaHistorial"></div>
</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
